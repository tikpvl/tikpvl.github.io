<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Мониторинг тестирования — избирательные комиссии</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --primary-gradient: linear-gradient(135deg, #0B3C68 0%, #0F4C81 50%, #0284C7 100%);
  --pri: #0F4C81;
  --pri-dark: #0B3C68;
  --gold: #F59E0B;
  --gold-dark: #D97706;
  --bg: #E2E8F0; /* Более темный, контрастный и глубокий фон */
  --card: #FFFFFF;
  --ink: #0F172A;
  --ink-sec: #475569;
  --mute: #64748B;
  --line: #CBD5E1;
  --ok: #15803D;
  --ok-bg: #DCFCE7;
  --bad: #B91C1C;
  --bad-bg: #FEE2E2;
  --warn: #B45309;
  --warn-bg: #FEF3C7;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background-color: var(--bg);
  color: var(--ink);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.page-wrap {
  width: 100%;
  max-width: 100%;
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  width: 100%;
  background: var(--primary-gradient);
  color: #fff;
  padding: 18px 24px;
  box-shadow: 0 8px 20px rgba(11,60,104,0.18);
  margin-bottom: 20px;
}
.header-in {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.header-brand {
  display: flex;
  align-items: center;
  gap: 14px;
}
.gov-icon {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: rgba(245, 158, 11, 0.2);
  border: 1.5px solid rgba(245, 158, 11, 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.gov-icon svg {
  width: 24px;
  height: 24px;
  fill: #FDE68A;
}
header b {
  font-size: 16px;
  font-weight: 700;
  line-height: 1.35;
  letter-spacing: -0.2px;
}
header small {
  display: block;
  font-size: 12.5px;
  color: #BAE6FD;
  margin-top: 2px;
  font-weight: 500;
}
main {
  width: 100%;
  flex: 1;
  padding: 0 24px 36px;
}
@media (max-width: 600px) {
  header { padding: 14px 16px; }
  main { padding: 0 14px 28px; }
}
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 22px;
  margin-bottom: 18px;
  box-shadow: var(--shadow-sm);
}
h2 {
  font-size: 16px;
  font-weight: 700;
  color: var(--pri-dark);
  margin: 0 0 14px;
  letter-spacing: -0.2px;
}
input, select, button {
  font-family: inherit;
  font-size: 14px;
  min-height: 46px;
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  color: var(--ink);
  transition: all 0.2s ease;
}
input:focus, select:focus {
  outline: none;
  border-color: var(--pri);
  box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
}
button {
  cursor: pointer;
  font-weight: 600;
}
.btn {
  background: var(--pri);
  color: #fff;
  border: none;
}
.btn:hover {
  background: var(--pri-dark);
}
.btn.sec {
  background: #fff;
  color: var(--pri);
  border: 1.5px solid var(--line);
}
.btn.sec:hover {
  background: #F8FAFC;
  border-color: #94A3B8;
}
.filters {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
  align-items: end;
}
.filters label {
  font-size: 12px;
  color: var(--ink-sec);
  display: block;
  margin-bottom: 4px;
  font-weight: 600;
}
.filters > div > * {
  width: 100%;
}
.kpis {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px;
  margin-bottom: 18px;
}
.kpi {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 18px;
  box-shadow: var(--shadow-sm);
}
.kpi b {
  display: block;
  font-size: 28px;
  font-weight: 800;
  color: var(--pri-dark);
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}
.kpi span {
  color: var(--mute);
  font-size: 13px;
  font-weight: 600;
  margin-top: 5px;
  display: block;
}
.grid2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}
@media (max-width: 900px) {
  .grid2 { grid-template-columns: 1fr; }
}
.bar {
  display: grid;
  grid-template-columns: 180px 1fr 100px;
  gap: 10px;
  align-items: center;
  margin: 9px 0;
  font-size: 13px;
}
@media (max-width: 480px) {
  .bar { grid-template-columns: 120px 1fr 80px; font-size: 12px; }
}
.bar .t {
  background: #E2E8F0;
  border-radius: 99px;
  height: 14px;
  overflow: hidden;
}
.bar .t i {
  display: block;
  height: 100%;
  background: var(--primary-gradient);
}
.bar .v {
  text-align: right;
  color: var(--mute);
  font-size: 12.5px;
  font-variant-numeric: tabular-nums;
  font-weight: 600;
}
.tw {
  overflow: auto;
  max-height: 600px;
  border: 1px solid var(--line);
  border-radius: 10px;
}
table {
  border-collapse: collapse;
  width: 100%;
  font-size: 13.5px;
}
th, td {
  padding: 11px 14px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  vertical-align: middle;
}
th {
  position: sticky;
  top: 0;
  background: #F8FAFC;
  cursor: pointer;
  white-space: nowrap;
  font-weight: 600;
  color: var(--pri-dark);
  border-bottom: 2px solid var(--line);
  z-index: 2;
}
.pill {
  display: inline-block;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.g { background: var(--ok-bg); color: var(--ok); }
.y { background: var(--warn-bg); color: var(--warn); }
.r { background: var(--bad-bg); color: var(--bad); }
.hard li {
  margin-bottom: 10px;
  font-size: 13.5px;
  line-height: 1.45;
  color: var(--ink-sec);
}
.hard li b {
  color: var(--pri-dark);
}
.m {
  color: var(--mute);
  font-size: 13px;
}
.hide { display: none !important; }

/* Форма входа */
#login {
  max-width: 400px;
  margin: 80px auto;
  padding: 28px;
  text-align: center;
}
#login h2 {
  font-size: 18px;
  margin-bottom: 20px;
}
#login input {
  margin-bottom: 14px;
}
#login button {
  width: 100%;
}

/* Оверлей загрузки */
#loader-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.5);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s ease;
  user-select: none;
}
#loader-overlay.active {
  opacity: 1;
  pointer-events: all;
}
.loader-num {
  font-size: min(48vw, 42vh);
  font-weight: 900;
  font-style: italic;
  line-height: 0.85;
  letter-spacing: -4px;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: linear-gradient(135deg, #FFFFFF 15%, #F59E0B 75%, #FCD34D 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 15px 30px rgba(0,0,0,0.5));
  font-variant-numeric: tabular-nums;
  transform: skewX(-6deg);
}
.loader-caption {
  margin-top: 16px;
  font-size: 13px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #F8FAFC;
  font-weight: 600;
  opacity: 0.85;
}
</style>
</head>
<body>
<div class="page-wrap">
  <header>
    <div class="header-in">
      <div class="header-brand">
        <div class="gov-icon">
          <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm6 12H6v-1c0-2 4-3.1 6-3.1s6 1.1 6 3.1v1z"/></svg>
        </div>
        <div>
          <b>Мониторинг тестирования</b>
          <small>Территориальная избирательная комиссия Павлодарской области</small>
        </div>
      </div>
      <div id="h-logout" class="hide">
        <button class="btn sec" id="logout" style="min-height:36px;padding:6px 14px;font-size:12.5px;border-radius:8px">Выйти</button>
      </div>
    </div>
  </header>

  <main>
    <!-- Оверлей загрузки -->
    <div id="loader-overlay">
      <div class="loader-num" id="pct-val">0%</div>
      <div class="loader-caption">Синхронизация данных</div>
    </div>

    <!-- Вход -->
    <div id="login" class="card hide">
      <h2>Вход</h2>
      <input id="key" type="password" placeholder="Введите пароль">
      <p id="lerr" style="color:var(--bad);font-size:13px;margin:0 0 14px"></p>
      <button class="btn" id="go">Войти</button>
    </div>

    <div id="app" class="hide">
      <div class="card">
        <div class="filters">
          <div><label>Район / город</label><select id="fd"><option value="">Все</option></select></div>
          <div><label>Тип комиссии</label><select id="fk"><option value="">УИК и ОИК</option><option>УИК</option><option>ОИК</option></select></div>
          <div><label>Результат от, %</label><input id="fmin" type="number" min="0" max="100" placeholder="0"></div>
          <div><label>Результат до, %</label><input id="fmax" type="number" min="0" max="100" placeholder="100"></div>
          <div><label>Поиск по ФИО / номеру</label><input id="fq" placeholder="Иванов или 12"></div>
          <div><button class="btn sec" id="reset">Сбросить</button></div>
          <div><button class="btn" id="refresh">Обновить данные</button></div>
        </div>
        <p class="m" id="upd" style="margin-top:14px;margin-bottom:0"></p>
      </div>

      <div class="kpis" id="kpis"></div>

      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px">
          <h2 style="margin:0">Сдавшие <span class="m" id="cnt"></span></h2>
          <button class="btn sec" id="csv" style="min-height:38px;padding:6px 16px">Скачать CSV</button>
        </div>
        <div class="tw">
          <table>
            <thead><tr id="th"></tr></thead>
            <tbody id="tb"></tbody>
          </table>
        </div>
      </div>

      <div class="grid2">
        <div class="card">
          <h2>Средний результат по районам и городам</h2>
          <div id="bd"></div>
        </div>
        <div class="card">
          <h2>Распределение результатов</h2>
          <div id="bh"></div>
          <h2 style="margin-top:22px">УИК и ОИК</h2>
          <div id="bk"></div>
        </div>
      </div>

      <div class="card">
        <h2>Чаще всего ошибались (по выбранным фильтрам)</h2>
        <ol class="hard" id="hard" style="padding-left:20px;margin:0"></ol>
      </div>
    </div>
  </main>
</div>

<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbyHILsdW6BNbhgG9w0acbCBeQyVJ1a7CrK_bUJKcKts3_tJao_ujzS7VYObPfa9oquP/exec";
const QT={"1":"В ТИК поступила жалоба на решение УИК. В какой срок комиссия обязана рассмотреть это обращение в ходе избирательного процесса?","2":"В какой момент кандидат в депутаты маслихата по одномандатному округу должен внести избирательный взнос?","3":"В какой срок государственные органы и организации обязаны предоставлять ответы на официальные обращения и запросы избирательных комиссий?","4":"В какой срок ОИК обязана представить протокол о регистрации кандидатов в вышестоящую или территориальную избирательную комиссию?","5":"В какой срок решение ОИК об отказе в регистрации или об отмене регистрации кандидата может быть обжаловано в вышестоящую комиссию или суд?","6":"В какой срок территориальная избирательная комиссия устанавливает итоги выборов депутатов маслихатов?","7":"В каких случаях бюллетени признаются недействительными?","8":"В каких случаях внесенный кандидатом в депутаты маслихата избирательный взнос (5 МЗП) подлежит возврату?","9":"В какой срок должен быть произведен повторный подсчет голосов, осуществляемый на основании решения избирательной комиссии?","10":"В каком размере кандидат в депутаты маслихата по одномандатному избирательному округу вносит избирательный взнос?","11":"В каком случае ОИК назначает повторное голосование по выборам депутата маслихата по одномандатному избирательному округу?","12":"В какие сроки доставляются избирательные бюллетени участковым избирательным комиссиям?","13":"В какие сроки публикуется в средствах массовой информации сообщение об итогах выборов депутатов маслихатов?","14":"В какие сроки прекращается выдача открепительных удостоверений избирателям?","15":"В какие сроки участковая избирательная комиссия оповещает избирателей о времени и месте голосования по выборам?","16":"В день голосования с момента открытия избирательного участка на избирательном участке вправе одновременно присутствовать:","17":"В день голосования участковые избирательные комиссии …","18":"В течение какого времени акимы должны оповестить избир const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let ALL=[],sortK="ts",sortD=-1;
const COLS=[["ts","Дата"],["district","Район / город"],["kind","Тип"],["num","№"],["fio","ФИО"],["ok","Верно"],["bad","Неверно"],["pct","%"],["wrong","Неверные вопросы (№ в базе)"]];
function pctClass(p){return p>=80?"g":p>=60?"y":"r"}

let pctTimer = null;
let currentPct = 0;

function startLoaderAnim() {
  currentPct = 0;
  $("pct-val").textContent = "0%";
  $("loader-overlay").classList.add("active");
  clearInterval(pctTimer);
  pctTimer = setInterval(() => {
    if (currentPct < 90) {
      currentPct += Math.floor(Math.random() * 8) + 3;
      if (currentPct > 90) currentPct = 90;
      $("pct-val").textContent = currentPct + "%";
    }
  }, 90);
}

function finishLoaderAnim() {
  clearInterval(pctTimer);
  $("pct-val").textContent = "100%";
  setTimeout(() => {
    $("loader-overlay").classList.remove("active");
  }, 300);
}

function stopLoaderAnim() {
  clearInterval(pctTimer);
  $("loader-overlay").classList.remove("active");
}

async function load(keyOverride){
  const key = keyOverride !== undefined ? keyOverride : (localStorage.getItem("ak") || "");
  const j=await new Promise((res,rej)=>{const cb="cb"+Date.now(),s=document.createElement("script");
    const t=setTimeout(()=>{c();rej(new Error("нет ответа от скрипта: проверьте развёртывание"))},20000);
    function c(){clearTimeout(t);delete window[cb];s.remove()}
    window[cb]=x=>{c();res(x)};s.onerror=()=>{c();rej(new Error("скрипт недоступен: проверьте развёртывание"))};
    s.src=SCRIPT_URL+"?action=list&key="+encodeURIComponent(key)+"&callback="+cb;document.head.appendChild(s)});
  if(!j.ok)throw new Error(j.error||"error");
  ALL=j.rows.map(r=>{const m=/^(УИК|ОИК)\s*№?\s*(\S*)/.exec(r.commission||"")||[];const ok=+r.ok||0,bad=+r.bad||0;
    return {ts:r.ts,district:r.district,kind:m[1]||"",num:m[2]||"",fio:r.fio,ok,bad,pct:Math.round(ok/Math.max(1,ok+bad)*100),wrong:(r.wrong&&r.wrong!=="—")?String(r.wrong):""}});
  const ds=[...new Set(ALL.map(r=>r.district))].sort();
  const cur=$("fd").value;$("fd").innerHTML='<option value="">Все</option>'+ds.map(d=>`<option>${esc(d)}</option>`).join("");$("fd").value=cur;
  $("upd").textContent="Обновлено: "+new Date().toLocaleString("ru-RU");
  draw();
}
function filtered(){
  const d=$("fd").value,k=$("fk").value,mn=$("fmin").value,mx=$("fmax").value,q=$("fq").value.trim().toLowerCase();
  return ALL.filter(r=>(!d||r.district===d)&&(!k||r.kind===k)&&(mn===""||r.pct>=+mn)&&(mx===""||r.pct<=+mx)&&(!q||(r.fio+" "+r.num).toLowerCase().includes(q)));
}
function bars(el,items,max,fmt){
  el.innerHTML=items.length?items.map(([n,v,extra])=>`<div class="bar"><div>${esc(n)}</div><div class="t"><i style="width:${max?v/max*100:0}%"></i></div><div class="v">${fmt(v,extra)}</div></div>`).join(""):'<p class="m">Нет данных</p>';
}
function draw(){
  const rows=filtered(),n=rows.length;
  const avg=n?Math.round(rows.reduce((a,r)=>a+r.pct,0)/n):0;
  const pass=rows.filter(r=>r.pct>=60).length;
  const best=n?Math.max(...rows.map(r=>r.pct)):0,low=n?Math.min(...rows.map(r=>r.pct)):0;
  $("kpis").innerHTML=[["Сдали тест",n],["Средний результат",avg+"%"],["Набрали 80% и выше",rows.filter(r=>r.pct>=80).length],["Ниже 60%",n-pass],["Лучший / худший",best+"% / "+low+"%"]].map(([a,b])=>`<div class="kpi"><b>${b}</b><span>${a}</span></div>`).join("");
  const by={};rows.forEach(r=>{(by[r.district]=by[r.district]||[]).push(r.pct)});
  bars($("bd"),Object.entries(by).map(([d,a])=>[d,Math.round(a.reduce((x,y)=>x+y,0)/a.length),a.length]).sort((a,b)=>b[1]-a[1]),100,(v,c)=>v+"% · "+c+" чел.");
  const buckets=[["0–39%",0,39],["40–59%",40,59],["60–79%",60,79],["80–100%",80,100]].map(([l,a,b])=>[l,rows.filter(r=>r.pct>=a&&r.pct<=b).length]);
  bars($("bh"),buckets,Math.max(1,...buckets.map(b=>b[1])),v=>v+" чел.");
  const kk=["УИК","ОИК"].map(k=>[k,rows.filter(r=>r.kind===k).length]);
  bars($("bk"),kk,Math.max(1,...kk.map(b=>b[1])),v=>v+" чел.");
  const cnt={};rows.forEach(r=>r.wrong.split(",").map(s=>s.trim()).filter(Boolean).forEach(x=>cnt[x]=(cnt[x]||0)+1));
  $("hard").innerHTML=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([q,c])=>`<li><b>№${q}</b> — ошибок: ${c}. ${esc(QT[q]||"")}</li>`).join("")||'<li class="m">Нет данных</li>';
  $("cnt").textContent="("+n+")";
  $("th").innerHTML=COLS.map(([k,l])=>`<th data-k="${k}">${l}${sortK===k?(sortD>0?" ▲":" ▼"):""}</th>`).join("");
  $("th").querySelectorAll("th").forEach(t=>t.onclick=()=>{const k=t.dataset.k;sortD=sortK===k?-sortD:1;sortK=k;draw()});
  const s=[...rows].sort((a,b)=>{const x=a[sortK],y=b[sortK];return (typeof x==="number"&&typeof y==="number"?x-y:String(x).localeCompare(String(y),"ru",{numeric:true}))*sortD});
  $("tb").innerHTML=s.map(r=>`<tr><td>${esc(r.ts)}</td><td>${esc(r.district)}</td><td>${r.kind}</td><td>${esc(r.num)}</td><td>${esc(r.fio)}</td><td>${r.ok}</td><td>${r.bad}</td><td><span class="pill ${pctClass(r.pct)}">${r.pct}%</span></td><td>${esc(r.wrong)}</td></tr>`).join("");
}
["fd","fk","fmin","fmax"].forEach(i=>$(i).onchange=draw);$("fq").oninput=draw;
$("reset").onclick=()=>{["fd","fk","fmin","fmax","fq"].forEach(i=>$(i).value="");draw()};
$("refresh").onclick=async ()=>{
  startLoaderAnim();
  try {
    await load();
    finishLoaderAnim();
  } catch(e) {
    stopLoaderAnim();
    alert("Ошибка: " + e.message);
  }
};
$("csv").onclick=()=>{const rows=filtered();const h=COLS.map(c=>c[1]);const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const t=[h.map(q).join(";")].concat(rows.map(r=>COLS.map(([k])=>q(r[k])).join(";"))).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+t],{type:"text/csv;charset=utf-8"}));a.download="results.csv";a.click()};

async function enter(){
  const val = $("key").value.trim();
  const currentKey = val || localStorage.getItem("ak") || "";
  if (!currentKey) {
    $("login").classList.remove("hide");
    $("lerr").textContent = "Введите пароль.";
    return;
  }
  
  startLoaderAnim();
  $("login").classList.add("hide");

  try {
    await load(currentKey);
    localStorage.setItem("ak", currentKey);
    finishLoaderAnim();
    $("app").classList.remove("hide");
    $("h-logout").classList.remove("hide");
    $("lerr").textContent = "";
  } catch(e) {
    stopLoaderAnim();
    $("login").classList.remove("hide");
    if(e.message === "forbidden"){
      $("lerr").textContent = "Неверный пароль.";
      localStorage.removeItem("ak");
    } else {
      $("lerr").textContent = "Не удалось загрузить: " + e.message;
    }
  }
}

$("go").onclick = enter;
$("key").onkeydown = e => { if(e.key === "Enter") enter(); };

$("logout").onclick = () => {
  localStorage.removeItem("ak");
  $("key").value = "";
  $("app").classList.add("hide");
  $("h-logout").classList.add("hide");
  $("login").classList.remove("hide");
};

if (localStorage.getItem("ak")) {
  enter();
} else {
  $("login").classList.remove("hide");
}
</script>
</body>
</html>
