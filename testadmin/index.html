<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Мониторинг тестирования — ТИК Павлодарской области</title>
<style>
:root{--blue:#104d80;--dark:#0b3559;--bg:#e7edf4;--line:#d5e0eb;--text:#15263b;--muted:#65758b;--white:#fff;--red:#bb2727}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--text)}header{background:linear-gradient(115deg,#0b3559,#10568e);color:white;padding:18px 25px;display:flex;justify-content:space-between;gap:10px;align-items:center}header strong{font-size:19px}header small{display:block;color:#c8e2f9;margin-top:2px}main{max-width:1550px;margin:20px auto;padding:0 20px}.card{background:var(--white);border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 15px #12233b0a;padding:20px;margin-bottom:16px}.hide{display:none!important}h2{font-size:17px;color:var(--dark);margin:0 0 13px}button,input,select{font:inherit;border:1px solid #c9d8e6;border-radius:8px;padding:10px 11px;min-height:41px;background:white;color:var(--text)}button{cursor:pointer;font-weight:600}button.primary{background:var(--blue);border-color:var(--blue);color:white}button.secondary{background:#f2f7fb}button:disabled{opacity:.45;cursor:not-allowed}button:hover:not(:disabled){filter:brightness(.96)}label{font-size:12px;font-weight:700;color:#53657b;display:block;margin-bottom:5px}.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px;align-items:end}.filters input,.filters select,.filters button{width:100%}.datebox{margin-top:15px;background:#f6f9fd;border:1px solid var(--line);border-radius:11px;padding:14px}.datebar{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.datebar>div{min-width:195px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.chip{background:#dcecff;color:#123d66;padding:6px 8px 6px 12px;border-radius:30px;display:flex;align-items:center;gap:7px;font-weight:650}.chip button{border:none;min-height:22px;padding:0 4px;background:transparent;font-size:19px}.subtext{font-size:12px;color:var(--muted);margin:10px 0 0}.warning{color:var(--red)}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:16px}.kpi{background:white;border:1px solid var(--line);border-radius:12px;padding:16px}.kpi b{display:block;font-size:27px;line-height:1.2;color:var(--dark)}.kpi span{font-size:12px;color:var(--muted);font-weight:650}.flex{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.scroll{overflow:auto;max-height:620px;border:1px solid var(--line);border-radius:9px}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:10px 12px;border-bottom:1px solid #e4ebf2;text-align:left}th{background:#f4f8fc;color:var(--dark);position:sticky;top:0;z-index:1;cursor:pointer;white-space:nowrap}td{font-size:13px}td:nth-child(1),td:nth-child(5){white-space:nowrap}.pill{display:inline-block;border-radius:6px;padding:3px 7px;font-weight:700}.green{background:#def6e7;color:#137b42}.yellow{background:#fff0ca;color:#926400}.red{background:#fde4e4;color:#b92323}.delete{color:#a52222;border-color:#f0c6c6;padding:4px 10px;min-height:30px}.layout2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.barrow{display:grid;grid-template-columns:minmax(95px,185px) 1fr minmax(85px,130px);gap:9px;align-items:center;margin:9px 0;font-size:12px}.track{height:13px;border-radius:20px;background:#e1eaf2;overflow:hidden}.track>i{height:100%;display:block;background:linear-gradient(90deg,#14558b,#21a1d1)}.value{text-align:right;color:var(--muted)}.pager{display:flex;align-items:center;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding-top:12px}.error{color:#bb2525}.login{max-width:390px;margin:70px auto;text-align:center}.login input{width:100%;max-width:250px;margin:7px 0 13px}.login button{width:100%}.busy{opacity:.65;pointer-events:none}@media(max-width:800px){.layout2{grid-template-columns:1fr}main{padding:0 12px}header{padding:14px}header strong{font-size:16px}.card{padding:14px}}@media print{button,.datebox,.filters{display:none!important}.scroll{max-height:none}}
</style>
</head>
<body>
<header><div><strong>Мониторинг тестирования</strong><small>Территориальная избирательная комиссия Павлодарской области</small></div><button id="logout" class="secondary hide">Выйти</button></header>
<main>
<section id="login" class="card login"><h2>Вход</h2><input type="password" id="key" placeholder="Пароль администратора" autocomplete="current-password"><div id="login-error" class="error"></div><button id="login-button" class="primary">Войти</button></section>
<div id="app" class="hide">
 <section class="card">
  <div class="filters">
   <div><label for="district">Район / город</label><select id="district"><option value="">Все</option></select></div>
   <div><label for="kind">Тип комиссии</label><select id="kind"><option value="">УИК и ОИК</option><option value="УИК">УИК</option><option value="ОИК">ОИК</option></select></div>
   <div><label for="min">Результат от, %</label><input type="number" min="0" max="100" id="min" placeholder="0"></div>
   <div><label for="max">Результат до, %</label><input type="number" min="0" max="100" id="max" placeholder="100"></div>
   <div><label for="search">ФИО / номер комиссии</label><input id="search" placeholder="Введите для поиска"></div>
   <div><button class="secondary" id="reset">Сбросить фильтры</button></div>
   <div><button class="primary" id="reload">Обновить данные</button></div>
  </div>
  <div class="datebox"><div class="datebar"><div><label for="date">Дата тестирования</label><input id="date" type="date" lang="ru"></div><button id="add-date" class="primary">Добавить дату</button><button id="all-dates" class="secondary">Все даты</button></div><div id="chips" class="chips"></div><p id="date-label" class="subtext">Показаны результаты за все даты</p></div>
  <p class="subtext" id="updated">Данные ещё не загружены</p><p class="subtext" id="freshness"></p>
 </section>
 <div class="kpis" id="kpis"></div>
 <section class="card"><div class="flex"><h2>Сдавшие тест <span id="count" class="subtext"></span></h2><button id="csv" class="secondary">Скачать CSV</button></div><div class="scroll"><table><thead><tr id="head"></tr></thead><tbody id="rows"></tbody></table></div><div class="pager"><span id="pages-label" class="subtext"></span><button id="prev" class="secondary">Назад</button><button id="next" class="secondary">Вперёд</button></div></section>
 <div class="layout2"><section class="card"><h2>Средний результат по районам и городам</h2><div id="by-district"></div></section><section class="card"><h2>Распределение результатов</h2><div id="hist"></div><h2 style="margin-top:24px">УИК и ОИК</h2><div id="by-kind"></div></section></div>
 <section class="card"><h2>Чаще всего ошибались (по выбранным фильтрам)</h2><ol id="wrong"></ol></section>
</div>
</main>
<script>
'use strict';
// Адрес действующего сервера мониторинга. При изменении URL развёртывания Apps Script замените здесь.
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbyHILsdW6BNbhgG9w0acbCBeQyVJ1a7CrK_bUJKcKts3_tJao_ujzS7VYObPfa9oquP/exec';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let all=[],filteredRows=[],selectedDates=new Set(),sortField='dateMillis',sortDirection=-1,page=0,requestId=0;
const PAGE_SIZE=100, HEADERS=[['ts','Дата'],['district','Район / город'],['kind','Тип'],['num','№'],['fio','ФИО'],['ok','Верно'],['bad','Неверно'],['pct','%'],['wrong','Неверные вопросы'],['delete','Удалить']];
function dateISO(v){
 if(v instanceof Date && !isNaN(v)) return [v.getFullYear(),String(v.getMonth()+1).padStart(2,'0'),String(v.getDate()).padStart(2,'0')].join('-');
 const s=String(v??'').trim();let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
 if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
 m=s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})/);
 if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');return '';
}
function dateMillis(s){const iso=dateISO(s);if(!iso)return 0;const m=String(s??'').match(/(?:\s|T)(\d{1,2}):(\d{2})(?::(\d{2}))?/);const d=new Date(iso+'T'+(m?m[1].padStart(2,'0')+':'+m[2]+':'+(m[3]||'00'):'00:00:00'));return Number.isFinite(+d)?+d:0;}
function parseRow(r){const commission=String(r.commission||r.kind||'').trim(),m=commission.match(/\b(УИК|ОИК)\b\s*№?\s*([^\s]*)/i);const ok=Number(r.ok)||0,bad=Number(r.bad)||0,ts=String(r.ts||'');return {ts,dateMillis:dateMillis(ts),iso:dateISO(ts),district:String(r.district||''),kind:m?m[1].toUpperCase():(/УИК|ОИК/i.test(commission)?commission.match(/УИК|ОИК/i)[0].toUpperCase():''),num:m?m[2]:String(r.num||''),fio:String(r.fio||''),ok,bad,pct:Math.round(ok/Math.max(1,ok+bad)*100),wrong:String(r.wrong&&r.wrong!=='—'?r.wrong:'')};}
function jsonp(params,timeout=45000){return new Promise((resolve,reject)=>{let done=false;const cb='testadmin_cb_'+Date.now()+'_'+(++requestId),s=document.createElement('script');const timer=setTimeout(()=>finish(new Error('Нет ответа от Google Apps Script')),timeout);function finish(err,val){if(done)return;done=true;clearTimeout(timer);delete window[cb];s.remove();err?reject(err):resolve(val)}window[cb]=data=>finish(null,data);s.onerror=()=>finish(new Error('Ошибка подключения к Google Apps Script'));const q=new URLSearchParams({...params,callback:cb,_:String(Date.now())});s.src=SCRIPT_URL+'?'+q;document.head.appendChild(s);});}
function sortRows(rows){return rows.sort((a,b)=>{const x=a[sortField],y=b[sortField];let z=typeof x==='number'&&typeof y==='number'?x-y:String(x??'').localeCompare(String(y??''),'ru',{numeric:true});if(z===0)z=a.dateMillis-b.dateMillis;return z*sortDirection;});}
function setLoading(on){$('reload').disabled=on;$('reload').textContent=on?'Загрузка…':'Обновить данные';}
async function load(key){
 setLoading(true);try{
  // Старый сервер возвращает все записи одним ответом. Новый может возвращать страницы.
  let result=await jsonp({action:'list',key,page:'1',pageSize:'1000'});
  if(!result||result.ok===false)throw new Error(result?.error||'Сервер не вернул данные');
  let raw=Array.isArray(result.rows)?result.rows:[];
  let total=Number(result.total??result.totalRows??result.totalCount);
  let pages=Number(result.pages??result.totalPages);
  if(Number.isFinite(total)&&total>raw.length){
    const size=Number(result.pageSize)||1000;
    const count=Number.isFinite(pages)&&pages>0?pages:Math.ceil(total/size);
    for(let n=2;n<=count;n++){
      const next=await jsonp({action:'list',key,page:String(n),pageSize:String(size)});
      if(next?.ok===false||!Array.isArray(next?.rows))throw new Error('Не удалось загрузить страницу '+n);
      raw.push(...next.rows);
    }
    if(raw.length<total)throw new Error('Получены не все записи: '+raw.length+' из '+total);
  }
  // Существуют версии Apps Script, где page — индекс с нуля.
  // Проверку полного количества отображаем отдельно, не выдавая частичный ответ за полный.
  all=raw.map(parseRow);
  const old=$('district').value;const districts=[...new Set(all.map(x=>x.district))].filter(Boolean).sort((a,b)=>a.localeCompare(b,'ru'));
  $('district').innerHTML='<option value="">Все</option>'+districts.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('');$('district').value=districts.includes(old)?old:'';
  const latest=all.reduce((max,r)=>Math.max(max,r.dateMillis),0);
  $('updated').textContent='Проверено: '+new Date().toLocaleString('ru-RU')+' · Получено записей: '+all.length;
  $('freshness').textContent=latest?'Последняя дата результата: '+new Date(latest).toLocaleString('ru-RU'):'Нет результатов с распознаваемой датой';
  $('freshness').classList.toggle('warning',Boolean(latest&&Date.now()-latest>48*3600*1000));
  page=0;draw();
 }finally{setLoading(false)}
}
function renderDates(){const arr=[...selectedDates].sort();$('chips').innerHTML=arr.map(d=>'<span class="chip">'+d.split('-').reverse().join('.')+' <button type="button" data-date="'+d+'" aria-label="Убрать дату">×</button></span>').join('');$('date-label').textContent=arr.length?'Выбрано дней: '+arr.length+'. Статистика за все выбранные дни вместе.':'Показаны результаты за все даты';$('chips').querySelectorAll('button').forEach(b=>b.onclick=()=>{selectedDates.delete(b.dataset.date);renderDates();page=0;draw()});}
function addDate(){const d=$('date').value;if(!d)return;selectedDates.add(d);renderDates();page=0;draw();}
function bars(id,values,max,suffix){$(id).innerHTML=values.length?values.map(x=>'<div class="barrow"><span>'+esc(x[0])+'</span><span class="track"><i style="width:'+Math.max(0,Math.min(100,(x[1]/(max||1))*100))+'%"></i></span><span class="value">'+esc(suffix(x))+'</span></div>').join(''):'<p class="subtext">Нет данных</p>';}
function draw(){
 const dist=$('district').value,kind=$('kind').value,min=$('min').value,max=$('max').value,q=$('search').value.trim().toLowerCase();
 filteredRows=sortRows(all.filter(r=>(!selectedDates.size||selectedDates.has(r.iso))&&(!dist||r.district===dist)&&(!kind||r.kind===kind)&&(min===''||r.pct>=+min)&&(max===''||r.pct<=+max)&&(!q||(r.fio+' '+r.num+' '+r.kind).toLowerCase().includes(q))));
 const n=filteredRows.length,avg=n?Math.round(filteredRows.reduce((a,r)=>a+r.pct,0)/n):0,best=n?Math.max(...filteredRows.map(r=>r.pct)):0,worst=n?Math.min(...filteredRows.map(r=>r.pct)):0;
 $('kpis').innerHTML=[['Сдали тест',n],['Средний результат',avg+'%'],['Набрали 80% и выше',filteredRows.filter(r=>r.pct>=80).length],['Ниже 60%',filteredRows.filter(r=>r.pct<60).length],['Лучший / худший',best+'% / '+worst+'%']].map(([k,v])=>'<div class="kpi"><b>'+v+'</b><span>'+k+'</span></div>').join('');
 const by={};filteredRows.forEach(r=>(by[r.district]??=[]).push(r.pct));bars('by-district',Object.entries(by).map(([d,a])=>[d,Math.round(a.reduce((x,y)=>x+y,0)/a.length),a.length]).sort((a,b)=>b[1]-a[1]),100,x=>x[1]+'% · '+x[2]+' чел.');
 const hist=[['0–39%',0,39],['40–59%',40,59],['60–79%',60,79],['80–100%',80,100]].map(([k,a,b])=>[k,filteredRows.filter(r=>r.pct>=a&&r.pct<=b).length]);bars('hist',hist,Math.max(1,...hist.map(x=>x[1])),x=>x[1]+' чел.');const kk=['УИК','ОИК'].map(k=>[k,filteredRows.filter(r=>r.kind===k).length]);bars('by-kind',kk,Math.max(1,...kk.map(x=>x[1])),x=>x[1]+' чел.');
 const wrong={};filteredRows.forEach(r=>r.wrong.split(/[,;]+/).map(x=>x.trim()).filter(x=>/^\d+$/.test(x)).forEach(x=>wrong[x]=(wrong[x]||0)+1));$('wrong').innerHTML=Object.entries(wrong).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([x,v])=>'<li>Вопрос №'+esc(x)+' — ошибок: '+v+'</li>').join('')||'<li class="subtext">Нет данных</li>';
 $('count').textContent='('+n+')';$('head').innerHTML=HEADERS.map(([k,v])=>'<th data-sort="'+k+'">'+v+(k===sortField?(sortDirection<0?' ▼':' ▲'):'')+'</th>').join('');$('head').querySelectorAll('th').forEach(h=>h.onclick=()=>{if(h.dataset.sort==='delete')return;sortDirection=sortField===h.dataset.sort?-sortDirection:(h.dataset.sort==='ts'?-1:1);sortField=h.dataset.sort==='ts'?'dateMillis':h.dataset.sort;page=0;draw();});
 const pages=Math.max(1,Math.ceil(n/PAGE_SIZE));page=Math.min(page,pages-1);
 $('rows').innerHTML=filteredRows.slice(page*PAGE_SIZE,(page+1)*PAGE_SIZE).map((r,i)=>'<tr><td>'+esc(r.ts)+'</td><td>'+esc(r.district)+'</td><td>'+esc(r.kind)+'</td><td>'+esc(r.num)+'</td><td>'+esc(r.fio)+'</td><td>'+r.ok+'</td><td>'+r.bad+'</td><td><span class="pill '+(r.pct>=80?'green':r.pct>=60?'yellow':'red')+'">'+r.pct+'%</span></td><td>'+esc(r.wrong)+'</td><td><button class="delete" data-index="'+(page*PAGE_SIZE+i)+'" title="Удалить запись">×</button></td></tr>').join('')||'<tr><td colspan="10">Нет результатов по выбранным фильтрам</td></tr>';
 $('rows').querySelectorAll('button[data-index]').forEach(b=>b.onclick=()=>removeRecord(filteredRows[+b.dataset.index]));$('pages-label').textContent='Страница '+(page+1)+' из '+pages;$('prev').disabled=page===0;$('next').disabled=page>=pages-1;
}
async function removeRecord(r){if(!confirm('Удалить запись без возможности восстановления?\n'+r.fio+'\n'+r.ts))return;try{const result=await jsonp({action:'delete',key:localStorage.getItem('ak')||'',ts:r.ts,fio:r.fio});if(!result?.ok)throw new Error(result?.error||'Ошибка удаления');await load(localStorage.getItem('ak')||'');}catch(e){alert('Не удалось удалить: '+e.message)}}
async function enter(){const key=$('key').value.trim()||localStorage.getItem('ak')||'';if(!key){$('login-error').textContent='Введите пароль';return;}$('login-button').disabled=true;$('login-error').textContent='';try{await load(key);localStorage.setItem('ak',key);$('login').classList.add('hide');$('app').classList.remove('hide');$('logout').classList.remove('hide');}catch(e){$('login').classList.remove('hide');$('app').classList.add('hide');$('login-error').textContent='Не удалось загрузить: '+e.message;if(e.message==='forbidden')localStorage.removeItem('ak')}finally{$('login-button').disabled=false}}
$('login-button').onclick=enter;$('key').onkeydown=e=>{if(e.key==='Enter')enter()};$('logout').onclick=()=>{localStorage.removeItem('ak');$('key').value='';$('app').classList.add('hide');$('logout').classList.add('hide');$('login').classList.remove('hide')};
['district','kind','min','max'].forEach(x=>$(x).onchange=()=>{page=0;draw()});$('search').oninput=()=>{page=0;draw()};$('date').onchange=addDate;$('add-date').onclick=addDate;$('all-dates').onclick=()=>{selectedDates.clear();$('date').value='';renderDates();page=0;draw()};$('reset').onclick=()=>{['district','kind','min','max','search','date'].forEach(x=>$(x).value='');selectedDates.clear();renderDates();page=0;sortField='dateMillis';sortDirection=-1;draw()};$('reload').onclick=async()=>{try{await load(localStorage.getItem('ak')||'')}catch(e){alert('Не удалось обновить: '+e.message)}};$('prev').onclick=()=>{page--;draw()};$('next').onclick=()=>{page++;draw()};
$('csv').onclick=()=>{const header=['Дата','Район / город','Тип','№','ФИО','Верно','Неверно','%','Неверные вопросы'];const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const lines=[header,...filteredRows.map(r=>[r.ts,r.district,r.kind,r.num,r.fio,r.ok,r.bad,r.pct,r.wrong])].map(r=>r.map(quote).join(';'));const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='test-results.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
renderDates();if(localStorage.getItem('ak'))enter();
</script>
</body>
</html>
