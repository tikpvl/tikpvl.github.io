<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Дашборд администратора — тест избиркома</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1c2433;--mute:#667085;--line:#e1e6ef;--pri:#1d4ed8;--pri2:#1e3a8a;--ok:#15803d;--bad:#b91c1c}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--pri2);color:#fff;padding:14px 16px}header .in,main{max-width:1200px;margin:0 auto}
main{padding:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
h2{font-size:17px;margin:0 0 12px}
input,select,button{font:inherit;padding:10px 12px;border:1px solid #c9d1e0;border-radius:10px;background:#fff;color:var(--ink)}
button{cursor:pointer}.btn{background:var(--pri);color:#fff;border:0;font-weight:600}.btn.sec{background:#fff;color:var(--pri);border:1px solid var(--pri)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
.filters label{font-size:12px;color:var(--mute);display:block;margin-bottom:4px;font-weight:600}.filters>div>*{width:100%}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.kpi b{display:block;font-size:28px}.kpi span{color:var(--mute);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.bar{display:grid;grid-template-columns:150px 1fr 90px;gap:8px;align-items:center;margin:7px 0;font-size:14px}
.bar .t{background:#eef1f7;border-radius:6px;height:18px;overflow:hidden}.bar .t i{display:block;height:100%;background:var(--pri)}
.bar .v{text-align:right;color:var(--mute);font-size:13px}
.tw{overflow:auto;max-height:560px}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:#f0f3fa;cursor:pointer;white-space:nowrap}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700}
.g{background:#e8f6ee;color:var(--ok)}.y{background:#fff4e0;color:#b45309}.r{background:#fdecec;color:var(--bad)}
.hard li{margin-bottom:8px;font-size:14px}.m{color:var(--mute);font-size:13px}.hide{display:none}
#login{max-width:380px;margin:60px auto}
</style></head><body>
<header><div class="in"><b>Дашборд администратора</b> · тестирование избирательных комиссий Павлодарской области</div></header>
<main>
<div id="login" class="card"><h2>Вход</h2><p class="m">Введите ключ администратора (ADMIN_KEY из Code.gs).</p>
<input id="key" type="password" style="width:100%" placeholder="Ключ"><p id="lerr" style="color:var(--bad);font-size:14px"></p><button class="btn" id="go">Войти</button></div>

<div id="app" class="hide">
<div class="card"><div class="filters">
<div><label>Район / город</label><select id="fd"><option value="">Все</option></select></div>
<div><label>Тип комиссии</label><select id="fk"><option value="">УИК и ОИК</option><option>УИК</option><option>ОИК</option></select></div>
<div><label>Результат от, %</label><input id="fmin" type="number" min="0" max="100" placeholder="0"></div>
<div><label>Результат до, %</label><input id="fmax" type="number" min="0" max="100" placeholder="100"></div>
<div><label>Поиск по ФИО / номеру</label><input id="fq" placeholder="Иванов или 12"></div>
<div><button class="btn sec" id="reset">Сбросить</button></div>
<div><button class="btn" id="refresh">Обновить данные</button></div>
</div><p class="m" id="upd"></p></div>

<div class="kpis" id="kpis"></div>
<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px"><h2 style="margin:0">Сдавшие <span class="m" id="cnt"></span></h2><button class="btn sec" id="csv">Скачать CSV</button></div>
<div class="tw"><table><thead><tr id="th"></tr></thead><tbody id="tb"></tbody></table></div></div>
<div class="grid2">
<div class="card"><h2>Средний результат по районам и городам</h2><div id="bd"></div></div>
<div class="card"><h2>Распределение результатов</h2><div id="bh"></div><h2 style="margin-top:18px">УИК и ОИК</h2><div id="bk"></div></div>
</div>
<div class="card"><h2>Чаще всего ошибались (по выбранным фильтрам)</h2><ol class="hard" id="hard"></ol></div>

</div></main>
<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbyHILsdW6BNbhgG9w0acbCBeQyVJ1a7CrK_bUJKcKts3_tJao_ujzS7VYObPfa9oquP/exec";
const QT={"1":"В ТИК поступила жалоба на решение УИК. В какой срок комиссия обязана рассмотреть это обращение в ходе избирательного процесса?","2":"В какой момент кандидат в депутаты маслихата по одномандатному округу должен внести избирательный взнос?","3":"В какой срок государственные органы и организации обязаны предоставлять ответы на официальные обращения и запросы избирательных комиссий?","4":"В какой срок ОИК обязана представить протокол о регистрации кандидатов в вышестоящую или территориальную избирательную комиссию?","5":"В какой срок решение ОИК об отказе в регистрации или об отмене регистрации кандидата может быть обжаловано в вышестоящую комиссию или суд?","6":"В какой срок территориальная избирательная комиссия устанавливает итоги выборов депутатов маслихатов?","7":"В каких случаях бюллетени признаются недействительными?","8":"В каких случаях внесенный кандидатом в депутаты маслихата избирательный взнос (5 МЗП) подлежит возврату?","9":"В какой срок должен быть произведен повторный подсчет голосов, осуществляемый на основании решения избирательной комиссии?","10":"В каком размере кандидат в депутаты маслихата по одномандатному избирательному округу вносит избирательный взнос?","11":"В каком случае ОИК назначает повторное голосование по выборам депутата маслихата по одномандатному избирательному округу?","12":"В какие сроки доставляются избирательные бюллетени участковым избирательным комиссиям?","13":"В какие сроки публикуется в средствах массовой информации сообщение об итогах выборов депутатов маслихатов?","14":"В какие сроки прекращается выдача открепительных удостоверений избирателям?","15":"В какие сроки участковая избирательная комиссия оповещает избирателей о времени и месте голосования по выборам?","16":"В день голосования с момента открытия избирательного участка на избирательном участке вправе одновременно присутствовать:","17":"В день голосования участковые избирательные комиссии …","18":"В течение какого времени акимы должны оповестить избирателей о границах избирательных участков и местах нахождения избирательных комиссий при выборах?","19":"В течение какого времени копия протокола ОИК о результатах голосования по избирательному округу должна находиться в помещении комиссии для всеобщего ознакомления?","20":"В течение какого срока вышестоящая избирательная комиссия обязана рассмотреть жалобу на решение или действие (бездействие) нижестоящей избирательной комиссии?","21":"В течение какого срока органы государственных доходов проверяют достоверность сведений в декларациях об активах и обязательствах кандидатов и их супругов?","22":"В случае если избирательных бюллетеней установленного образца в переносной избирательной урне оказалось больше, чем число письменных заявлений, …","23":"В случае нарушения законодательства Республики Казахстан о выборах член избирательной комиссии:","24":"В случае нарушения законодательства Республики Казахстан о выборах наблюдатель и иные лица ...","25":"Главным требованием к аккредитации общественных объединений и некоммерческих организаций по наблюдению за выборами является …","26":"Действия участковой избирательной комиссии при предъявлении избирателем открепительного удостоверения на право голосования в день голосования?","27":"Депутат маслихата, избранный по партийному списку, досрочно выбыл. Что происходит с мандатом?","28":"Доверенные лица и наблюдатели, присутствующие при подсчете голосов, наблюдают за подсчетом голосов на расстоянии и в условиях, обеспечивающих обозримость …","29":"До какого момента кандидат в депутаты маслихата по одномандатному избирательному округу имеет право отозвать свою кандидатуру, подав заявление в ОИК?","30":"Допускается ли использование агитационных материалов, изготовленных для предыдущих избирательных кампаний?","31":"Жалоба на решение ОИК одновременно подана в ТИК и в суд. Как поступает ТИК?","32":"За сколько дней до голосования запрещается опубликование результатов опросов общественного мнения в СМИ и на онлайн-платформах?","33":"Из каких источников и в каких пределах образуется избирательный фонд кандидата в депутаты маслихатов районов и городов областного значения?","34":"Избиратель обнаружил, что он не включен в список избирателей за 10 дней до выборов. В какой срок комиссия обязана рассмотреть его заявление?","35":"Избиратель по ошибке испортил бюллетень и требует выдать ему второй. Как должен поступить член УИК?","36":"Как оплачивается сверхурочная работа, работа в праздничные и выходные дни, труд в ночное время членов избирательных комиссий?","37":"Как проходит процедура подсчета избирательных бюллетеней?","38":"Как исчисляется заработная плата членов избирательных комиссий, не являющихся государственными служащими, в период подготовки и проведения выборов?","39":"Как принимается решение при возникновении разногласий в отношении действительности бюллетеней?","40":"Какова минимальная совокупная квота для женщин и молодежи в партийных списках кандидатов в депутаты маслихатов?","41":"Какое действие обязан совершить председатель УИК за 30 минут до начала голосования в присутствии членов комиссии и наблюдателей?","42":"Какое из следующих процедурных ограничений проверяет комиссия при приеме документов и вынесении решения о регистрации кандидатов в депутаты маслихата по одномандатному округу?","43":"Какое ограничение установлено законом для общественных объединений (за исключением политических партий) при выдвижении кандидатов в депутаты маслихата по одномандатным округам?","44":"Какое условие является обязательным для допуска представителя отечественного средства массовой информации на избирательный участок в день голосования?","45":"Какое количество членов избирательной комиссии сопровождают переносную урну для голосования?","46":"Какой орган вправе организовывать предвыборные дебаты между кандидатами в депутаты маслихатов?","47":"Какой орган регистрирует доверенных лиц на выборах депутатов маслихатов?","48":"Какой процентный барьер должна преодолеть политическая партия для участия в распределении депутатских мандатов маслихата по партийным спискам?","49":"Каким документом удостоверяются полномочия наблюдателя?","50":"Какие сроки рассмотрения заявления на аккредитацию в качестве наблюдателей?","51":"Какие документы должен иметь представитель средства массовой информации Республики Казахстан для присутствия на избирательном участке?","52":"Кандидат в депутаты маслихата по одномандатному округу пришел в ОИК в день выдвижения и приложил к первичному заявлению квитанцию об уплате избирательного взноса. Какова правильная последовательность действий комиссии при проведении процедуры регистрации в части избирательного взноса?","53":"Кандидаты и политические партии, выдвинувшие партийные списки, определяют доверенных лиц по своему усмотрению в количестве, …","54":"Кем подписываются протоколы о результатах голосования?","55":"Когда по законодательству начинается голосование вне помещения для голосования?","56":"Когда участковая избирательная комиссия производит подсчет избирателей, получивших бюллетени, и определяет их общее число?","57":"Кому участковые избирательные комиссии немедленно пересылают первые экземпляры протоколов о результатах голосования по одномандатным избирательным округам?","58":"Копия протокола о результатах голосования вывешивается в помещении избирательного участка в специально установленном месте для всеобщего ознакомления …","59":"Количество бюллетеней в переносной избирательной урне должно соответствовать …","60":"Кто делает соответствующую отметку в списке избирателей против фамилии избирателя, подавшего заявление на голосование вне помещения для голосования?","61":"Кто определяет график работы участковых избирательных комиссий, за исключением дня голосования?","62":"Кто определяет порядок и объем сообщений избирательных комиссии, размещаемых в периодических печатных изданиях?","63":"Кто и в какой срок определяет очередность получения мандатов внутри партийного списка по итогам выборов?","64":"На каких участников избирательного процесса не распространяется требование о предоставлении объема информации для агитации пользователями онлайн-платформ исключительно на договорной основе?","65":"На основании какого документа банковское учреждение открывает специальный временный счет избирательного фонда кандидата в депутаты маслихата по одномандатному округу?","66":"На сколько дней окружная избирательная комиссия продлевает срок выдвижения кандидатов, если на день окончания выдвижения по округу зарегистрировано менее двух кандидатов?","67":"Не позднее чем за сколько дней до дня голосования территориальные комиссии передают открепительные удостоверения участковым по акту?","68":"Обвинительный приговор суда в отношении кандидата вступил в законную силу за 1 день до дня голосования (в «день тишины»). Каковы правомерные действия комиссии?","69":"ОГД выдал документ о недостоверности декларации кандидата, и ОИК/ТИК отменила его регистрацию. Кандидат подал иск в суд. До начала слушаний ОГД признал свою техническую ошибку и предложил комиссии заменить справку на «благоприятную» для кандидата. Как должна поступить комиссия?","70":"Перед вскрытием урн все неиспользованные бюллетени …","71":"Переносные избирательные урны ....","72":"По какой избирательной системе избираются депутаты маслихатов столицы, областей, городов республиканского значения?","73":"По желанию кого, выдается копия протокола о результатах голосования?","74":"После регистрации кандидата «Д» в депутаты маслихата по одномандатному избирательному округу выяснилось, что его родной брат является секретарем одной из участковых избирательных комиссий (УИК) данного избирательного округа. Какое решение должно быть принято в связи с возникшим ограничением?","75":"Предвыборная агитация – …","76":"При возникновении разногласий в отношении действительности бюллетеней вопрос разрешается избирательной комиссией путем …","77":"Работодатель хочет уволить сотрудника, являющегося членом УИК, в период проведения избирательной кампании. Законны ли действия работодателя?","78":"Разрешается ли размещение агитационного баннера на здании театра, признанного памятником архитектуры?","79":"Регистрация кандидата отменена решением комиссии. На его специальном счёте есть пожертвования. Когда и как они возвращаются?","80":"С какого возраста граждане Республики Казахстан допускаются к деятельности в качестве наблюдателей и доверенных лиц?","81":"Сколько открепительных удостоверений выдается избирателю, который будет в другом населенном пункте в рамках своего округа районного (городского) маслихата?","82":"Сколько открепительных удостоверений выдается избирателю, который будет находиться в пределах области, но вне своего одномандатного округа областного маслихата?","83":"Списки избирателей по каждому избирательному участку представляются по акту ...","84":"Сколько дней находится в помещении избирательного участка копия протокола о результатах подсчета голосов?","85":"Сроки проведения предвыборной агитации?","86":"Урны для голосования должны вскрываться соответствующей избирательной комиссией …","87":"Член комиссии обнаружил бюллетень, в котором отметка за партию сделана карандашом. Является ли такой бюллетень действительным?","88":"Чему соответствует цвет открепительного удостоверения на выборах маслихатов?","89":"Что делает УИК, если избиратель просит открепительное удостоверение для голосования в другой области?","90":"Что гарантирует тайное голосование на выборах?","91":"Что запрещается избирателю в день голосования в отношении заполненного избирательного бюллетеня?","92":"Что происходит, если кандидат в депутаты маслихата по одномандатному округу прошел проверку на соответствие требованиям закона, но не предоставил документ об уплате избирательного взноса до окончания срока регистрации?","93":"Что является юридическим основанием для включения гражданина в список избирателей на конкретном участке?","94":"По какой избирательной системе избираются депутаты маслихатов районов и городов областного значения?","95":"В маслихате области 37 мандат ер собственных средств политической партии, направляемых в ее избирательный фонд на каждый партийный список при выборах депутатов маслихата?","108":"Каков предельный размер избирательного фонда кандидата в депутаты маслихатов столицы, областей и городов республиканского значения?","109":"Какой орган выделяет кандидатам по одномандатным округам бюджетные средства на издание печатных агитационных материалов (плакатов, листовок)?","110":"В ОИК поступили материалы прокуратуры о том, что кандидат лично заказал и оплатил наличными деньгами (из собственных средств, не зачисленных на специальный временный счет избирательного фонда) печать 5 000 агитационных буклетов в местной типографии. Каковы правовые последствия данного нарушения для кандидата?","111":"Кандидат «А» подал жалобу в ОИК на Кандидата «Б», обвиняя его в распространении сведений, подрывающих деловую репутацию. Каков правомерный порядок действий ОИК?","112":"В «день тишины» в мессенджерах WhatsApp массово рассылаются призывы голосовать за кандидата. Как должна поступить комиссия?","113":"Кандидат подал жалобу в вышестоящую ТИК на решение ОИК об отказе в его регистрации на 9-й день после вынесения решения, ссылаясь на общую норму о 10-дневном сроке обжалования решений комиссий. Какое решение должна принять ТИК?","114":"ТИК приняла решение об исключении лица из партийного списка из-за недостоверности его декларации. Как это решение может быть обжаловано?","115":"За 1 день до выборов в ОИК поступило вступившее в силу решение суда о восстановлении ранее снятого кандидата. Как должна поступить ОИК?","116":"Полномочия избирательных комиссий при подведении итогов выборов депутатов маслихатов","117":"В какой срок сообщение об итогах выборов депутатов маслихатов публикуется в СМИ?","118":"Какой орган производит регистрацию избранных депутатов маслихатов и выдает им депутатские удостоверения и нагрудные знаки?","119":"Какой орган полномочен принять решение о признании выборов депутата маслихата по избирательному участку или округу недействительными при выявлении нарушений закона?","120":"ТИК признала выборы недействительными. Какое утверждение о повторных выборах верно?","121":"ТИК признала выборы в округе недействительными. Кто и в какой срок вправе обжаловать это решение?","122":"Кто присутствует при повторном подсчете голосов избирателей, осуществляемый на основании решения избирательной комиссии?","123":"В «день тишины» в социальной сети сохраняется ранее опубликованный агитационный ролик партии. Обязана ли комиссия требовать его удаления?","124":"Каковы действия избирательной комиссии в случае, когда отдельные избиратели по состоянию здоровья, по причине ухода за больным членом семьи, а также находящиеся в отдаленных и труднодоступных районах, где не образованы избирательные участки, не могут прибыть для голосования.","125":"В день голосования на избирательный участок пришел гражданин, которому исполнилось 18 лет непосредственно в день выборов. Какое решение должна принять участковая избирательная комиссия относительно его права на голосование?","126":"На основании чего проводится повторный подсчет голосов?","127":"Заседания избирательных комиссий правомочны, если в них принимает участие …","128":"Кому наблюдатель предъявляет документы для регистрации?","129":"Какой орган осуществляет аккредитацию региональных и местных общественных объединений и некоммерческих организаций, к уставной деятельности которых относится осуществление деятельности по наблюдению за выборами?","130":"Какое участие необходимо для правомочности заседания ОИК?","131":"Сколько кандидатов в каждом округе выдвигает общественное объединение (не политическая партия) и его филиал?","132":"Кто устанавливает текст бюллетеня для голосования по выборам депутатов маслихатов по одномандатным территориальным округам?","133":"Не позднее какого дня после регистрации ОИК публикует в местных СМИ сообщение о регистрации кандидата?","134":"Как принимаются решения ОИК?","135":"Какие полномочия в отношении участковых комиссий есть у ОИК?","136":"Какое основание влечет только отмену регистрации (но не отказ в регистрации)?","137":"За сколько дней до дня голосования не допускаются отмена регистрации и восстановление ранее исключенного кандидата?","138":"В протоколе УИК строки заполнены карандашом, а в графе итогов есть исправление. Что вправе сделать ОИК?","139":"Кто вправе проводить предвыборную агитацию, не требующую финансирования?","140":"По окончании подсчета голосов наблюдатели отмечают расхождения в количестве проголосовавших, по их подсчетам и по результатам комиссии, и требуют пересчитать бюллетени. Действия членов УИК?","141":"Какое из указанных лиц НЕ может быть доверенным лицом кандидата в депутаты маслихата?","142":"Сколько открепительных удостоверений выдается избирателю, который будет находиться в своем одномандатном округе областного маслихата, но вне округа районного (городского) маслихата?","143":"Какие организации имеют право проводить опрос общественного мнения?","144":"Что делают с неиспользованными открепительными удостоверениями?","145":"При каких обстоятельствах соответствующая вышестоящая избирательная комиссия вправе принять решение о повторном подсчете голосов избирателей соответствующей участковой избирательной комиссией?"};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let ALL=[],sortK="ts",sortD=-1;
const COLS=[["ts","Дата"],["district","Район / город"],["kind","Тип"],["num","№"],["fio","ФИО"],["ok","Верно"],["bad","Неверно"],["pct","%"],["wrong","Неверные вопросы (№ в базе)"]];
function pctClass(p){return p>=80?"g":p>=60?"y":"r"}
async function load(){
  const key=sessionStorage.getItem("ak")||"";
  const j=await new Promise((res,rej)=>{const cb="cb"+Date.now(),s=document.createElement("script");
    const t=setTimeout(()=>{c();rej(new Error("нет ответа от скрипта: проверьте развёртывание (новая версия, доступ «Все»)"))},20000);
    function c(){clearTimeout(t);delete window[cb];s.remove()}
    window[cb]=x=>{c();res(x)};s.onerror=()=>{c();rej(new Error("скрипт недоступен: проверьте развёртывание (новая версия, доступ «Все»)"))};
    s.src=SCRIPT_URL+"?action=list&key="+encodeURIComponent(key)+"&callback="+cb;document.head.appendChild(s)});
  if(!j.ok)throw new Error(j.error||"error");
  ALL=j.rows.map(r=>{const m=/^(УИК|ОИК)\s*№?\s*(\S*)/.exec(r.commission||"")||[];const ok=+r.ok||0,bad=+r.bad||0;
    return {ts:r.ts,district:r.district,kind:m[1]||"",num:m[2]||"",fio:r.fio,ok,bad,pct:Math.round(ok/Math.max(1,ok+bad)*100),wrong:(r.wrong&&r.wrong!=="—")?String(r.wrong):""}});
  const ds=[...new Set(ALL.map(r=>r.district))].sort();
  const cur=$("fd").value;$("fd").innerHTML='<option value="">Все</option>'+ds.map(d=>`<option>${esc(d)}</option>`).join("");$("fd").value=cur;
  $("upd").textContent="Обновлено: "+new Date().toLocaleString("ru-RU");
  draw();
}
function filtered(){
  const d=$("fd").value,k=$("fk").value,mn=$("fmin").value,mx=$("fmax").value,q=$("fq").value.trim().toLowerCase();
  return ALL.filter(r=>(!d||r.district===d)&&(!k||r.kind===k)&&(mn===""||r.pct>=+mn)&&(mx===""||r.pct<=+mx)&&(!q||(r.fio+" "+r.num).toLowerCase().includes(q)));
}
function bars(el,items,max,fmt){
  el.innerHTML=items.length?items.map(([n,v,extra])=>`<div class="bar"><div>${esc(n)}</div><div class="t"><i style="width:${max?v/max*100:0}%"></i></div><div class="v">${fmt(v,extra)}</div></div>`).join(""):'<p class="m">Нет данных</p>';
}
function draw(){
  const rows=filtered(),n=rows.length;
  const avg=n?Math.round(rows.reduce((a,r)=>a+r.pct,0)/n):0;
  const pass=rows.filter(r=>r.pct>=60).length;
  const best=n?Math.max(...rows.map(r=>r.pct)):0,low=n?Math.min(...rows.map(r=>r.pct)):0;
  $("kpis").innerHTML=[["Сдали тест",n],["Средний результат",avg+"%"],["Набрали 80% и выше",rows.filter(r=>r.pct>=80).length],["Ниже 60%",n-pass],["Лучший / худший",best+"% / "+low+"%"]].map(([a,b])=>`<div class="kpi"><b>${b}</b><span>${a}</span></div>`).join("");
  const by={};rows.forEach(r=>{(by[r.district]=by[r.district]||[]).push(r.pct)});
  bars($("bd"),Object.entries(by).map(([d,a])=>[d,Math.round(a.reduce((x,y)=>x+y,0)/a.length),a.length]).sort((a,b)=>b[1]-a[1]),100,(v,c)=>v+"% · "+c+" чел.");
  const buckets=[["0–39%",0,39],["40–59%",40,59],["60–79%",60,79],["80–100%",80,100]].map(([l,a,b])=>[l,rows.filter(r=>r.pct>=a&&r.pct<=b).length]);
  bars($("bh"),buckets,Math.max(1,...buckets.map(b=>b[1])),v=>v+" чел.");
  const kk=["УИК","ОИК"].map(k=>[k,rows.filter(r=>r.kind===k).length]);
  bars($("bk"),kk,Math.max(1,...kk.map(b=>b[1])),v=>v+" чел.");
  const cnt={};rows.forEach(r=>r.wrong.split(",").map(s=>s.trim()).filter(Boolean).forEach(x=>cnt[x]=(cnt[x]||0)+1));
  $("hard").innerHTML=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([q,c])=>`<li><b>№${q}</b> — ошибок: ${c}. ${esc(QT[q]||"")}</li>`).join("")||'<li class="m">Нет данных</li>';
  $("cnt").textContent="("+n+")";
  $("th").innerHTML=COLS.map(([k,l])=>`<th data-k="${k}">${l}${sortK===k?(sortD>0?" ▲":" ▼"):""}</th>`).join("");
  $("th").querySelectorAll("th").forEach(t=>t.onclick=()=>{const k=t.dataset.k;sortD=sortK===k?-sortD:1;sortK=k;draw()});
  const s=[...rows].sort((a,b)=>{const x=a[sortK],y=b[sortK];return (typeof x==="number"&&typeof y==="number"?x-y:String(x).localeCompare(String(y),"ru",{numeric:true}))*sortD});
  $("tb").innerHTML=s.map(r=>`<tr><td>${esc(r.ts)}</td><td>${esc(r.district)}</td><td>${r.kind}</td><td>${esc(r.num)}</td><td>${esc(r.fio)}</td><td>${r.ok}</td><td>${r.bad}</td><td><span class="pill ${pctClass(r.pct)}">${r.pct}%</span></td><td>${esc(r.wrong)}</td></tr>`).join("");
}
["fd","fk","fmin","fmax"].forEach(i=>$(i).onchange=draw);$("fq").oninput=draw;
$("reset").onclick=()=>{["fd","fk","fmin","fmax","fq"].forEach(i=>$(i).value="");draw()};
$("refresh").onclick=()=>load().catch(e=>alert("Ошибка: "+e.message));
$("csv").onclick=()=>{const rows=filtered();const h=COLS.map(c=>c[1]);const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const t=[h.map(q).join(";")].concat(rows.map(r=>COLS.map(([k])=>q(r[k])).join(";"))).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+t],{type:"text/csv;charset=utf-8"}));a.download="results.csv";a.click()};
async function enter(){
  sessionStorage.setItem("ak",$("key").value.trim());$("lerr").textContent="Загрузка…";
  try{await load();$("login").classList.add("hide");$("app").classList.remove("hide")}
  catch(e){$("lerr").textContent=e.message==="forbidden"?"Неверный ключ.":"Не удалось загрузить: "+e.message;sessionStorage.removeItem("ak")}
}
$("go").onclick=enter;$("key").onkeydown=e=>{if(e.key==="Enter")enter()};
if(sessionStorage.getItem("ak"))enter();
</script></body></html>
