<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мониторинг тестирования — ТИК Павлодарской области</title>
<style>
:root{--blue:#0F4C81;--dark:#0B3C68;--bg:#E2E8F0;--line:#CBD5E1;--muted:#64748B;--red:#B91C1C}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#0F172A;font:14px/1.5 Inter,Arial,sans-serif}
header{background:linear-gradient(135deg,#0B3C68,#0F4C81 55%,#0284C7);color:white;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header b{font-size:18px}header small{display:block;color:#BAE6FD}main{padding:20px 24px 32px}
.card,.kpi{background:white;border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 4px #0001}.card{padding:20px;margin-bottom:18px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
label{display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:5px}
input,select,button{font:inherit;min-height:42px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:white;color:#0F172A;max-width:100%}
.filters input,.filters select{width:100%}button{cursor:pointer;font-weight:700}.primary{background:var(--blue);color:white;border-color:var(--blue)}button:hover{filter:brightness(.96)}
.muted{color:var(--muted);font-size:12px}.hidden{display:none!important}
h2{font-size:17px;color:var(--dark);margin:0 0 13px}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px;margin-bottom:18px}.kpi{padding:18px}.kpi b{font-size:28px;display:block;color:var(--dark)}.kpi span{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.bar{display:grid;grid-template-columns:minmax(110px,180px) 1fr 100px;gap:8px;align-items:center;margin:10px 0;font-size:12px}.track{height:13px;background:#E2E8F0;border-radius:20px;overflow:hidden}.track i{display:block;height:100%;background:linear-gradient(90deg,#0F4C81,#0284C7)}.bar-value{text-align:right}
.table-scroll{overflow:auto;max-height:650px;border:1px solid var(--line);border-radius:8px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{position:sticky;top:0;background:#F8FAFC;color:var(--dark);cursor:pointer;z-index:1}td.wrong{white-space:normal;min-width:130px}.score{font-weight:700;padding:3px 8px;border-radius:5px}.score.good{background:#DCFCE7;color:#15803D}.score.mid{background:#FEF3C7;color:#B45309}.score.low{background:#FEE2E2;color:#B91C1C}.danger{color:var(--red);border-color:#FECACA;min-height:30px;padding:3px 9px}
.datebox{margin-top:16px;background:#F8FAFC;border:1px solid var(--line);padding:15px;border-radius:10px}.datecontrols{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.datecontrols input{min-width:180px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.chip{display:inline-flex;gap:9px;align-items:center;background:#DBEAFE;border-radius:50px;padding:4px 10px;color:#0B3C68;font-weight:700}.chip button{border:0;min-height:24px;padding:0;background:transparent;font-size:20px;color:#0B3C68}
#login{max-width:390px;margin:65px auto;text-align:center}#login input,#login button{width:100%;margin:5px 0}#error{color:var(--red)}#status{margin-top:12px}#freshness{margin-top:5px}#hard li{margin-bottom:8px}
@media(max-width:850px){.grid2{grid-template-columns:1fr}}@media(max-width:600px){main{padding:14px}header{padding:14px}.card{padding:14px}.bar{grid-template-columns:110px 1fr 78px}}
</style>
</head>
<body>
<header><div><b>Мониторинг тестирования</b><small>Территориальная избирательная комиссия Павлодарской области</small></div><button id="logout" class="hidden">Выйти</button></header>
<main>
<section id="login" class="card"><h2>Вход в админ-панель</h2><input id="password" type="password" placeholder="Пароль администратора" autocomplete="current-password"><button class="primary" id="loginBtn">Войти</button><p id="error"></p></section>
<div id="app" class="hidden">
<section class="card">
<div class="filters">
<div><label for="district">Район / город</label><select id="district"><option value="">Все</option></select></div>
<div><label for="kind">Тип комиссии</label><select id="kind"><option value="">УИК и ОИК</option><option value="УИК">УИК</option><option value="ОИК">ОИК</option></select></div>
<div><label for="min">Результат от, %</label><input id="min" type="number" min="0" max="100" placeholder="0"></div>
<div><label for="max">Результат до, %</label><input id="max" type="number" min="0" max="100" placeholder="100"></div>
<div><label for="search">Поиск по ФИО / №</label><input id="search" type="search" placeholder="ФИО или номер"></div>
<div><button id="reset" style="width:100%">Сбросить фильтры</button></div>
<div><button class="primary" id="refresh" style="width:100%">Обновить данные</button></div>
</div>
<div class="datebox"><b>Фильтр по датам тестирования</b><div class="datecontrols" style="margin-top:10px"><div><label for="pick">Выбрать дату в календаре</label><input type="date" id="pick"></div><button class="primary" id="addDate">Добавить дату</button><button id="allDates">Все даты</button></div><div id="chips" class="chips"></div><div id="dateInfo" class="muted" style="margin-top:8px">Показываются все даты</div></div>
<div id="status" class="muted"></div><div id="freshness" class="muted"></div>
</section>
<div class="kpis" id="kpis"></div>
<section class="card"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px"><h2 style="margin:0">Сдавшие <span id="count" class="muted"></span></h2><button id="csv">Скачать CSV</button></div><div class="table-scroll"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div></section>
<div class="grid2"><section class="card"><h2>Средний результат по районам и городам</h2><div id="districtBars"></div></section><section class="card"><h2>Распределение результатов</h2><div id="resultBars"></div><h2 style="margin-top:20px">УИК и ОИК</h2><div id="kindBars"></div></section></div>
<section class="card"><h2>Чаще всего ошибались (по выбранным фильтрам)</h2><ol id="hard"></ol></section>
</div>
</main>
<script>
'use strict';
// Существующий адрес Google Apps Script. При новом развёртывании замените его на новый /exec.
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbyHILsdW6BNbhgG9w0acbCBeQyVJ1a7CrK_bUJKcKts3_tJao_ujzS7VYObPfa9oquP/exec';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ALL=[],sortKey='ts',sortDir=-1;const selectedDates=new Set();
const COLUMNS=[['ts','Дата'],['district','Район / город'],['kind','Тип'],['num','№'],['fio','ФИО'],['ok','Верно'],['bad','Неверно'],['pct','%'],['wrong','Неверные вопросы']];
function day(s){
 if(s instanceof Date&&!isNaN(s))return [s.getFullYear(),String(s.getMonth()+1).padStart(2,'0'),String(s.getDate()).padStart(2,'0')].join('-');
 const a=String(s??'').trim();let m=a.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
 m=a.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})/);return m?m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'):'';
}
function dateLabel(d){return d.split('-').reverse().join('.')}
function dateSortValue(s){const d=day(s);const t=String(s).match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/);return d?(d+(t?'T'+t[1].padStart(2,'0')+':'+t[2]+':'+(t[3]||'00'):'T00:00:00')):''}
function jsonp(params,timeout=40000){return new Promise((resolve,reject)=>{
 const cb='tik_cb_'+Date.now()+'_'+Math.floor(Math.random()*1e8);const script=document.createElement('script');let ended=false;
 const finish=(err,data)=>{if(ended)return;ended=true;clearTimeout(timer);delete window[cb];script.remove();err?reject(err):resolve(data)};
 const timer=setTimeout(()=>finish(new Error('Нет ответа от Google Apps Script (тайм-аут)')),timeout);
 window[cb]=data=>finish(null,data);
 const url=new URL(SCRIPT_URL);Object.entries({...params,callback:cb,_:Date.now()}).forEach(([k,v])=>url.searchParams.set(k,String(v)));script.src=url.toString();script.onerror=()=>finish(new Error('Не удалось подключиться к Google Apps Script'));document.head.appendChild(script);
})}
function setBusy(b){$('refresh').disabled=b;$('refresh').textContent=b?'Загружаю…':'Обновить данные'}
function normalize(r){const m=/^(УИК|ОИК)\s*№?\s*(.*)$/i.exec(String(r.commission||''));const ok=Number(r.ok)||0,bad=Number(r.bad)||0;return {ts:String(r.ts||''),district:String(r.district||''),kind:(m?.[1]||r.kind||'').toUpperCase(),num:String(m?.[2]||r.num||'').replace(/^№/,'').trim(),fio:String(r.fio||''),ok,bad,pct:Math.round(100*ok/Math.max(1,ok+bad)),wrong:String(r.wrong||'').replace(/^—$/,'')}}
async function load(key){
 setBusy(true);$('status').textContent='Запрос новых результатов…';
 try{
  // Старый Apps Script возвращает все результаты одним списком.
  // Если новая версия поддерживает страницы — загружаем все страницы.
  const first=await jsonp({action:'list',key,page:1,pageSize:500});
  if(!first||!first.ok)throw new Error(first?.error==='forbidden'?'Неверный пароль':first?.error||'Ошибка сервера');
  if(!Array.isArray(first.rows))throw new Error('Сервер не вернул массив rows');
  let rows=first.rows.slice();
  const totalPages=Number(first.totalPages||first.total_pages||0);
  if(totalPages>1){
   for(let page=2;page<=totalPages;page++){
    $('status').textContent='Получение данных: страница '+page+' из '+totalPages;
    const part=await jsonp({action:'list',key,page,pageSize:500});
    if(!part.ok||!Array.isArray(part.rows))throw new Error('Не удалось получить страницу '+page);
    rows.push(...part.rows);
   }
  }
  ALL=rows.map(normalize);const previous=$('district').value;
  const districts=[...new Set(ALL.map(r=>r.district).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ru'));
  $('district').innerHTML='<option value="">Все</option>'+districts.map(d=>'<option value="'+esc(d)+'">'+esc(d)+'</option>').join('');
  $('district').value=districts.includes(previous)?previous:'';
  const dates=ALL.map(r=>day(r.ts)).filter(Boolean).sort(),latest=dates.at(-1)||'';
  $('status').textContent='Данные проверены: '+new Date().toLocaleString('ru-RU')+' · получено записей: '+ALL.length;
  const old=latest?Math.floor((Date.now()-new Date(latest+'T00:00:00').getTime())/86400000):null;
  $('freshness').textContent=latest?'Последняя дата результата, полученная от сервера: '+dateLabel(latest)+(old>1?' · Внимание: данные старше '+old+' дн. Проверьте источник Google Apps Script.':''):'Нет записей с распознаваемой датой';
  $('freshness').style.color=old>1?'#B91C1C':'#64748B';draw();
 }catch(e){$('status').textContent='Ошибка обновления: '+e.message;throw e}finally{setBusy(false)}
}
function datesUI(){const dates=[...selectedDates].sort();$('chips').innerHTML=dates.map(d=>'<span class="chip">'+dateLabel(d)+' <button type="button" data-day="'+d+'" aria-label="Удалить дату">×</button></span>').join('');$('dateInfo').textContent=dates.length?'Выбрано дат: '+dates.length+'. Вся статистика рассчитана только по этим дням.':'Показываются все даты';$('chips').querySelectorAll('button').forEach(b=>b.onclick=()=>{selectedDates.delete(b.dataset.day);datesUI();draw()})}
function addDate(){const d=$('pick').value;if(!d)return;selectedDates.add(d);datesUI();draw()}
function filtered(){const d=$('district').value,k=$('kind').value,mn=$('min').value,mx=$('max').value,q=$('search').value.trim().toLowerCase();return ALL.filter(r=>(!selectedDates.size||selectedDates.has(day(r.ts)))&&(!d||r.district===d)&&(!k||r.kind===k)&&(mn===''||r.pct>=Number(mn))&&(mx===''||r.pct<=Number(mx))&&(!q||(r.fio+' '+r.num).toLowerCase().includes(q)))}
function bars(id,items,max,unit){$(id).innerHTML=items.length?items.map(([n,v,extra])=>'<div class="bar"><div>'+esc(n)+'</div><div class="track"><i style="width:'+Math.max(0,Math.min(100,Math.round(v/Math.max(max,1)*100)))+'%"></i></div><div class="bar-value">'+esc(v+unit+(extra!==undefined?' · '+extra+' чел.':''))+'</div></div>').join(''):'<p class="muted">Нет данных</p>'}
function draw(){const a=filtered(),n=a.length,avg=n?Math.round(a.reduce((s,r)=>s+r.pct,0)/n):0,pass=a.filter(r=>r.pct>=60).length,best=n?Math.max(...a.map(r=>r.pct)):0,worst=n?Math.min(...a.map(r=>r.pct)):0;
 $('kpis').innerHTML=[['Сдали тест',n],['Средний результат',avg+'%'],['Набрали 80% и выше',a.filter(r=>r.pct>=80).length],['Ниже 60%',n-pass],['Лучший / худший',best+'% / '+worst+'%']].map(([label,value])=>'<div class="kpi"><b>'+esc(value)+'</b><span>'+esc(label)+'</span></div>').join('');
 const grouped={};a.forEach(r=>(grouped[r.district]??=[]).push(r.pct));bars('districtBars',Object.entries(grouped).map(([name,vals])=>[name,Math.round(vals.reduce((x,y)=>x+y,0)/vals.length),vals.length]).sort((x,y)=>y[1]-x[1]),100,'%');
 const buckets=[['0–39%',0,39],['40–59%',40,59],['60–79%',60,79],['80–100%',80,100]].map(([s,lo,hi])=>[s,a.filter(r=>r.pct>=lo&&r.pct<=hi).length]);bars('resultBars',buckets,Math.max(1,...buckets.map(x=>x[1])),' чел.');
 const kinds=['УИК','ОИК'].map(k=>[k,a.filter(r=>r.kind===k).length]);bars('kindBars',kinds,Math.max(1,...kinds.map(x=>x[1])),' чел.');
 const wrong={};a.forEach(r=>r.wrong.split(',').map(x=>x.trim()).filter(x=>/^\d+$/.test(x)).forEach(x=>wrong[x]=(wrong[x]||0)+1));$('hard').innerHTML=Object.entries(wrong).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([q,count])=>'<li>Вопрос №'+esc(q)+' — ошибок: '+count+'</li>').join('')||'<li class="muted">Нет данных</li>';
 $('count').textContent='('+n+')';$('head').innerHTML=COLUMNS.map(([k,label])=>'<th data-key="'+k+'">'+esc(label)+(sortKey===k?(sortDir>0?' ▲':' ▼'):'')+'</th>').join('')+'<th>Удалить</th>';
 $('head').querySelectorAll('[data-key]').forEach(th=>th.onclick=()=>{const k=th.dataset.key;sortDir=sortKey===k?-sortDir:1;sortKey=k;draw()});
 const sorted=a.slice().sort((x,y)=>{let v=sortKey==='ts'?dateSortValue(x.ts).localeCompare(dateSortValue(y.ts)):(typeof x[sortKey]==='number'?x[sortKey]-y[sortKey]:String(x[sortKey]).localeCompare(String(y[sortKey]),'ru',{numeric:true}));return v*sortDir});
 $('body').innerHTML=sorted.map(r=>'<tr>'+COLUMNS.map(([k])=>'<td'+(k==='wrong'?' class="wrong"':'')+'>'+(k==='pct'?'<span class="score '+(r.pct>=80?'good':r.pct>=60?'mid':'low')+'">'+r.pct+'%</span>':esc(r[k]))+'</td>').join('')+'<td><button class="danger delete" data-ts="'+esc(r.ts)+'" data-fio="'+esc(r.fio)+'" title="Удалить запись">×</button></td></tr>').join('');
 $('body').querySelectorAll('.delete').forEach(b=>b.onclick=()=>removeRow(b.dataset.ts,b.dataset.fio));
}
async function removeRow(ts,fio){if(!confirm('Безвозвратно удалить результат?\n'+fio+'\n'+ts))return;try{const j=await jsonp({action:'delete',key:localStorage.getItem('ak')||'',ts,fio});if(!j.ok)throw new Error(j.error||'Удаление не выполнено');await load(localStorage.getItem('ak'));}catch(e){alert('Ошибка удаления: '+e.message)}}
async function enter(){const key=$('password').value.trim()||localStorage.getItem('ak')||'';if(!key){$('error').textContent='Введите пароль';return}$('loginBtn').disabled=true;$('error').textContent='Загрузка…';try{await load(key);localStorage.setItem('ak',key);$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');$('error').textContent=''}catch(e){$('error').textContent=e.message;if(e.message==='Неверный пароль')localStorage.removeItem('ak')}finally{$('loginBtn').disabled=false}}
$('loginBtn').onclick=enter;$('password').onkeydown=e=>{if(e.key==='Enter')enter()};$('refresh').onclick=()=>load(localStorage.getItem('ak')||'').catch(e=>alert(e.message));
$('logout').onclick=()=>{localStorage.removeItem('ak');ALL=[];$('password').value='';$('login').classList.remove('hidden');$('app').classList.add('hidden');$('logout').classList.add('hidden')};
$('addDate').onclick=addDate;$('pick').onchange=addDate;$('allDates').onclick=()=>{selectedDates.clear();$('pick').value='';datesUI();draw()};
['district','kind','min','max'].forEach(id=>$(id).onchange=draw);$('search').oninput=draw;
$('reset').onclick=()=>{['district','kind','min','max','search','pick'].forEach(id=>$(id).value='');selectedDates.clear();datesUI();draw()};
$('csv').onclick=()=>{const data=filtered();const csv=[COLUMNS.map(x=>x[1]),...data.map(r=>COLUMNS.map(([k])=>r[k]))].map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');const url=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download='testadmin-results.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
datesUI();if(localStorage.getItem('ak'))enter();
</script>
</body>
</html>
